<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101e30" />
    <title>AERIS — Carte de mission</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        notion: {
                            50: '#f2f5f8',
                            100: '#e1e7f0',
                            200: '#c6d2e3',
                            300: '#9fb3cf',
                            400: '#718eb8',
                            500: '#4e6fa1',
                            600: '#3c5684',
                            700: '#30446b',
                            800: '#2a3a58',
                            900: '#101e30',
                            950: '#0a1320',
                        },
                        aeris: '#034a90',
                        gendarmerie: {
                            blue: '#034a90',
                            beige: '#d8d3c4',
                            navy: '#101e30'
                        }
                    },
                    boxShadow: {
                        panel: '0 8px 30px rgba(25, 25, 24, 0.08)'
                    }
                }
            }
        };
    </script>
    <style>
        #map { position: relative; z-index: 0; }
        .leaflet-container { width: 100%; height: 100%; font: inherit; z-index: 0; }
        .leaflet-pane { z-index: 1; }
        .leaflet-top, .leaflet-bottom { z-index: 10; }
        .leaflet-control-zoom { display: none; }
        .weather-popup { min-width: 260px; color: #101e30; }
        .weather-popup-header { border-bottom: 1px solid #d8d3c4; padding-bottom: 8px; font-size: 12px; font-weight: 700; }
        .weather-popup-header span { display: block; margin-top: 2px; color: #034a90; font-size: 10px; font-weight: 400; }
        .weather-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
        .weather-metrics div { border: 1px solid #d8d3c4; border-radius: 6px; padding: 6px; }
        .weather-metrics small { display: block; color: #034a90; font-size: 9px; text-transform: uppercase; }
        .weather-metrics strong { display: block; margin-top: 2px; font-size: 12px; }
        .weather-stability { border-radius: 6px; padding: 7px; font-size: 10px; font-weight: 600; text-align: center; }
        .weather-drone-title { margin: 10px 0 5px; color: #034a90; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .weather-drone { display: flex; justify-content: space-between; border-radius: 5px; margin-top: 4px; padding: 6px; font-size: 10px; }
        .weather-good { color: #15803d; background: #f0fdf4; }
        .weather-warning { color: #b45309; background: #fffbeb; }
        .weather-critical { color: #b91c1c; background: #fef2f2; }
        .restriction-popup { min-width: 260px; color: #101e30; font-size: 11px; }
        .restriction-popup-header { border-bottom: 1px solid #d8d3c4; padding-bottom: 8px; color: #034a90; font-size: 12px; font-weight: 700; }
        .restriction-popup-header span { display: block; margin-top: 3px; color: #718096; font-size: 10px; font-weight: 400; }
        .restriction-popup-body { padding-top: 9px; }
        .restriction-popup-body ul { margin: 7px 0; padding-left: 18px; }
        .restriction-popup-body h3 { margin: 10px 0 5px; color: #034a90; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .restriction-popup-muted { margin: 5px 0; color: #4e6fa1; font-size: 10px; }
        .restriction-drone-card { border: 1px solid #d8d3c4; border-radius: 5px; margin-top: 4px; padding: 6px; }
        .restriction-drone-card strong, .restriction-drone-card span { display: block; margin-bottom: 2px; }
        .restriction-drone-card a, .restriction-popup-warning a { color: #034a90; text-decoration: underline; }
        .restriction-popup-warning { border-top: 1px solid #d8d3c4; margin: 9px 0 0; padding-top: 7px; color: #718096; font-size: 9px; line-height: 1.4; }
    </style>
</head>

<body class="overflow-hidden bg-notion-50 font-sans text-notion-900 antialiased">
    <div id="app" class="relative h-screen w-screen overflow-hidden"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="src/drones.js"></script>
    <!-- Point d'entrée de l'interface graphique AERIS. -->
    <script type="module" src="ui/app.js"></script>
</body>

</html>
