<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Ma carte</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
    />

  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>Ma carte interactive</h1>

	<div style="margin: 10px;">
		<label for="gpx-file">Importer un fichier GPX : </label>
		<input type="file" id="gpx-file" accept=".gpx">
	</div>

	<label for="radiusRange">Rayon de sécurité : <span id="radiusValue">200</span> m</label>
	<input type="range" id="radiusRange" min="50" max="1000" step="50" value="200">

  <div id="map"></div>

	
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
  <script src="testCharles.js"></script>
	<script src="drones.js"></script>
</body>
</html>
